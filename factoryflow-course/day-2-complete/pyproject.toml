[project]
name = "factoryflow"
version = "0.3.0"
description = "OEE reporting for production line A"
requires-python = ">=3.12"
dependencies = [
    # Capped below 3.0 deliberately: participants google and use AI agents, both
    # of which emit pandas 2.x idioms that error under 3.0.
    "pandas>=2.2,<3",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "plotly>=5.24",
    "httpx>=0.28",
    "pydantic>=2.9",
]

# NOTE(facilitator): Doc 03 §6 requires these to be pinned to exact versions and
# frozen four weeks before the event. Ranges are for the build phase only.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
factoryflow = "factoryflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factoryflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Plotly's own API is written around dict(...) and every example in its docs
# uses it. Rewriting those as literals would make the chart code look nothing
# like the documentation you read beside it. A linter rule you can justify
# switching off is a linter rule you understand -- but write down the reason.
"dashboard/*.py" = ["C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
